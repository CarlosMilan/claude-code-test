<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Kōhi</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-name { font-family: 'Shippori Mincho B1', serif; font-size: 1.8rem; font-weight: 700; }
    .brand-name a { color: var(--text); }
    .brand-sub { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 0.2rem; }
    .footer-link { text-align: center; font-size: 0.875rem; color: var(--text-muted); }
  </style>
</head>
<body class="page">
  <div class="brand">
    <div class="brand-name"><a href="index.html">Kōhi</a></div>
    <div class="brand-sub">Acceso</div>
  </div>

  <div class="card">
    <div id="alert-error" class="alert alert-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="tu@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <div class="divider">o</div>
    <p class="footer-link">¿No tenés cuenta? <a href="register.html">Unirte a la lista</a></p>
  </div>

  <script>
    if (localStorage.getItem('kohi_token')) window.location.href = 'dashboard.html';

    const form      = document.getElementById('login-form');
    const errAlert  = document.getElementById('alert-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errAlert.classList.remove('visible');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando…';

      try {
        const res  = await fetch('/api/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errAlert.textContent = data.error || 'Error al ingresar.';
          errAlert.classList.add('visible');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';
          return;
        }

        localStorage.setItem('kohi_token', data.token);
        window.location.href = 'dashboard.html';
      } catch {
        errAlert.textContent = 'Error de conexión. Intentá de nuevo.';
        errAlert.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
